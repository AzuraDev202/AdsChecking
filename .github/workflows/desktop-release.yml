name: Windows desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - name: Validate release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os; from adschecking.updates import APP_VERSION, version_tuple; assert version_tuple(os.environ['RELEASE_TAG']) == version_tuple(APP_VERSION), 'Release tag must match APP_VERSION'"
      - run: python -m pytest -q
      - shell: pwsh
        run: ./build-desktop.ps1 -Python (Get-Command python).Source
      - uses: actions/upload-artifact@v4
        with:
          name: AdsChecking-windows-x64
          path: |
            dist/AdsChecking-windows-x64.zip
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AdsChecking-windows-x64
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "AdsChecking $RELEASE_TAG" --generate-notes
