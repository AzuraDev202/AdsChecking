name: Windows desktop
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the Windows ZIP and checksum to GitHub Releases'
        required: true
        type: boolean
        default: false
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release tag commit to be merged into main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must reference a commit already merged into main.' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - name: Read desktop release version
        id: version
        shell: pwsh
        run: |
          python -c "import os; from adschecking.updates import APP_VERSION, version_tuple; version_tuple(APP_VERSION); open(os.environ['GITHUB_OUTPUT'], 'a').write('release_tag=v' + APP_VERSION + '\n')"
      - name: Validate release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os; from adschecking.updates import APP_VERSION, version_tuple; assert version_tuple(os.environ['RELEASE_TAG']) == version_tuple(APP_VERSION), 'Release tag must match APP_VERSION'"
      - run: python -m pytest -q
      - shell: pwsh
        run: ./build-desktop.ps1 -Python (Get-Command python).Source
      - uses: actions/upload-artifact@v4
        with:
          name: AdsChecking-windows-x64
          if-no-files-found: error
          path: |
            dist/AdsChecking-windows-x64.zip
            dist/SHA256SUMS.txt
  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check whether this version needs publication
        id: publication
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        with:
          script: |
            const params = {owner: context.repo.owner, repo: context.repo.repo};
            const tag = process.env.RELEASE_TAG;
            try {
              const existing = await github.rest.repos.getReleaseByTag({...params, tag});
              if (existing.data.draft) {
                throw new Error(`Release ${tag} is still a draft. Inspect or remove that draft before retrying.`);
              }
              core.info(`Release ${tag} already exists; leaving its assets unchanged.`);
              core.setOutput('publish', 'false');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              const latest = await github.rest.repos.getLatestRelease(params);
              const parse = value => {
                if (!/^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(value)) {
                  throw new Error(`Invalid stable release version: ${value}`);
                }
                return value.replace(/^v/, '').split('.').map(Number);
              };
              const candidate = parse(tag), current = parse(latest.data.tag_name);
              const difference = candidate.findIndex((number, index) => number !== current[index]);
              if (difference === -1 || candidate[difference] < current[difference]) {
                core.info(`Skipping ${tag}; latest release is ${latest.data.tag_name}.`);
                core.setOutput('publish', 'false');
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('publish', 'true');
      - uses: actions/download-artifact@v4
        if: steps.publication.outputs.publish == 'true'
        with:
          name: AdsChecking-windows-x64
          path: release
      - name: Publish GitHub release
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" AdsChecking-windows-x64.zip SHA256SUMS.txt --draft --target "$RELEASE_COMMIT" --title "AdsChecking $RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Verify public ZIP download
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/AdsChecking-windows-x64.zip" --output release/download-check.zip
          cd release
          expected=$(cut -d ' ' -f 1 SHA256SUMS.txt)
          echo "$expected  download-check.zip" | sha256sum --check
